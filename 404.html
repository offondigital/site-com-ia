<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; frame-src https://script.google.com; style-src 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Página não encontrada · InovaSEO</title>
<style>
  html,body{margin:0;height:100%;background:#EEF2F0;color:#14201B;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  main{min-height:100%;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
  a{color:#1D6B57;font-weight:600}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
</style>
</head>
<body>
<main id="nf"><div><h1>Página não encontrada</h1><p>O endereço pode ter mudado. <a href="/">Voltar para o início</a>.</p></div></main>
<script>
  // Link de inscrição do CRM: inovaseo.com.br/crm/usuario/CÓDIGO
  var m = location.pathname.match(/^\/crm\/usuario\/([A-Za-z0-9]{20,40})\/?$/);
  if (m) {
    document.title = "Criar acesso ao CRM · InovaSEO";
    var f = document.createElement("iframe");
    f.id = "app"; f.title = "CRM"; f.referrerPolicy = "no-referrer"; f.allow = "clipboard-write";
    f.src = "https://script.google.com/macros/s/AKfycbzfq7QkmxCfFa3obkWCx_CkByneP08zhOrvUuuvrGAqyhPxoRYlBCciVgGY_3mwLt5C9g/exec?convite=" + m[1];
    document.getElementById("nf").remove();
    document.body.appendChild(f);
  }
</script>
</body>
</html>
