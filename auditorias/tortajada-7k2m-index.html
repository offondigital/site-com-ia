  var SLUG="tortajada-7k2m";
  function ev(n,p){window.dataLayer.push(Object.assign({event:n,auditoria_cliente:SLUG},p||{}));}
  function d64(x){var b=atob(x),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
  function track(){
    var sent={};function once(k,n,p){if(!sent[k]){sent[k]=1;ev(n,p);}}
    addEventListener('scroll',function(){var h=document.documentElement,pct=Math.round((h.scrollTop+innerHeight)/h.scrollHeight*100);[25,50,75,100].forEach(function(t){if(pct>=t)once('s'+t,'auditoria_scroll',{percent:t});});},{passive:true});
    var cta=document.querySelector('.cta');
    if(cta&&'IntersectionObserver' in window)new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting)once('cta','auditoria_cta_view');});},{threshold:.6}).observe(cta);
    [30,60,120].forEach(function(sec){setTimeout(function(){once('t'+sec,'auditoria_tempo',{segundos:sec});},sec*1000);});
  }
  document.getElementById('f').addEventListener('submit',async function(e){
    e.preventDefault();
    var btn=document.getElementById('go'),err=document.getElementById('err'),pw=document.getElementById('pw').value;
    err.textContent='';btn.disabled=true;btn.textContent='Abrindo...';
    try{
      var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
      var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:d64(P.s),iterations:P.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
      var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:d64(P.i)},key,d64(P.c));
      var html=new TextDecoder().decode(pt);
      var tpl=document.createElement('div');tpl.innerHTML=html;
      tpl.querySelectorAll('style').forEach(function(st){document.head.appendChild(st);});
      document.body.replaceChildren.apply(document.body,Array.prototype.slice.call(tpl.childNodes));
      ev('auditoria_desbloqueio');ev('auditoria_view_conteudo');track();
    }catch(x){
      err.textContent=(x&&x.name==='OperationError')?'Senha incorreta.':'Não foi possível abrir. Use um navegador atualizado em conexão segura (https).';
      btn.disabled=false;btn.textContent='Abrir';ev('auditoria_senha_errada');
    }
  });
