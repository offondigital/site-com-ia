<html lang="pt-BR">
<head>

<title>Proposta comercial · {{CLIENTE}}</title>
<link rel="icon" href="/assets/logo-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Google Analytics 4 -->
<script async src="https://www.googletagmanager.com/gtag/js?id={{GA4_ID}}"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','{{GA4_ID}}',{page_title:'Proposta · {{CLIENTE}}'});</script>

<!-- Meta Pixel -->
<script>!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');fbq('init','{{PIXEL_ID}}');fbq('track','PageView');</script>

<style>
:root{
  --bg:hsl(210,40%,98%);--card:#fff;--fg:hsl(215,50%,15%);--muted:hsl(215,20%,40%);
  --line:hsl(214,32%,91%);--soft:hsl(214,100%,97%);--soft2:hsl(214,95%,93%);
  --primary:hsl(217,91%,60%);--primary-strong:hsl(224,76%,48%);--deep:hsl(226,71%,40%);
  --ok:hsl(142,76%,30%);--ok-soft:hsl(142,72%,94%);--warn:hsl(24,95%,45%);--warn-soft:hsl(38,100%,95%);
  --err:#b3261e;--shadow:0 10px 30px -12px hsla(215,50%,15%,.18);
}
@media (prefers-color-scheme:dark){:root{
  --bg:hsl(220,40%,8%);--card:hsl(220,32%,12%);--fg:hsl(210,30%,94%);--muted:hsl(215,18%,68%);
  --line:hsl(218,25%,22%);--soft:hsl(222,40%,16%);--soft2:hsl(222,40%,20%);
  --primary:hsl(213,94%,68%);--primary-strong:hsl(213,94%,72%);--deep:hsl(217,91%,60%);
  --ok:hsl(142,60%,62%);--ok-soft:hsl(142,40%,14%);--warn:hsl(32,95%,62%);--warn-soft:hsl(30,50%,14%);
  --err:#ff8a80;--shadow:0 10px 30px -12px rgba(0,0,0,.6);
}}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"Inter",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--fg);line-height:1.6;font-size:16px}
a{color:var(--primary-strong)}
.marca{font-weight:800;letter-spacing:-.02em}
.marca span{color:var(--primary)}

/* Portão de senha */
#gate{min-height:100vh;display:grid;place-items:center;padding:24px 16px;
  background:radial-gradient(ellipse 80% 50% at 50% -10%,hsla(217,91%,60%,.25),transparent),var(--bg)}
#gate form{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:32px 24px;box-shadow:var(--shadow)}
#gate .marca{font-size:1.1rem;margin-bottom:24px;display:block}
#gate h1{font-size:1.5rem;line-height:1.25;letter-spacing:-.02em;margin-bottom:8px}
#gate p{color:var(--muted);font-size:.95rem;margin-bottom:20px}
#gate label{display:block;font-weight:600;font-size:.9rem;margin-bottom:6px}
#gate input{font:inherit;font-size:1.05rem;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg);letter-spacing:.04em}
#gate input:focus{outline:2px solid var(--primary);outline-offset:1px;border-color:transparent}
#gate button{margin-top:16px;width:100%;font:inherit;font-weight:700;font-size:1rem;padding:13px;border:0;border-radius:999px;background:var(--primary-strong);color:#fff;cursor:pointer}
#gate button:disabled{opacity:.7;cursor:wait}
#erro{color:var(--err);font-size:.9rem;margin-top:12px}

/* Proposta */
#proposta{display:none}
.topo{background:linear-gradient(135deg,hsl(217,91%,55%) 0%,hsl(224,76%,44%) 55%,hsl(226,71%,32%) 100%);color:#fff;padding:28px 16px 64px}
.topo .wrap{max-width:860px;margin:0 auto}
.topo .marca{font-size:1.05rem;opacity:.95}
.topo .marca span{color:#cfe0ff}
.topo .meta{margin-top:40px;font-size:.85rem;text-transform:uppercase;letter-spacing:.08em;opacity:.8;font-weight:600}
.topo h1{font-size:clamp(1.8rem,5.5vw,2.8rem);line-height:1.15;letter-spacing:-.025em;margin:10px 0 14px;max-width:720px}
.topo .lead{font-size:clamp(1rem,2.6vw,1.15rem);opacity:.92;max-width:640px}
main{max-width:860px;margin:-40px auto 0;padding:0 16px 48px;display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
section{min-width:0}
section{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 22px;box-shadow:var(--shadow)}
@media (min-width:640px){section{padding:36px 36px}}
.etiqueta{display:inline-block;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--primary-strong);background:var(--soft);padding:4px 12px;border-radius:999px;margin-bottom:12px}
h2{font-size:clamp(1.35rem,3.6vw,1.75rem);line-height:1.25;letter-spacing:-.02em;margin-bottom:12px}
h3{font-size:1.1rem;letter-spacing:-.01em;margin:22px 0 8px}
p+p{margin-top:10px}
section>p{color:var(--fg)}
.sub{color:var(--muted)}
ul.lista{list-style:none;margin-top:12px;display:grid;gap:10px}
ul.lista li{padding-left:26px;position:relative}
ul.lista li::before{content:"";position:absolute;left:4px;top:.6em;width:9px;height:9px;border-radius:3px;background:var(--primary)}
ol.passos{list-style:none;counter-reset:p;margin-top:14px;display:grid;gap:12px}
ol.passos li{counter-increment:p;padding-left:44px;position:relative;min-height:32px}
ol.passos li::before{content:counter(p);position:absolute;left:0;top:-2px;width:30px;height:30px;border-radius:50%;background:var(--soft2);color:var(--primary-strong);font-weight:800;display:grid;place-items:center;font-size:.9rem}

/* Cartões de valor */
.valores{display:grid;gap:12px;margin-top:18px}
@media (min-width:720px){.valores{grid-template-columns:repeat(3,1fr)}}
.valor{border:1px solid var(--line);border-radius:16px;padding:18px;background:var(--bg);display:flex;flex-direction:column;gap:6px}
.valor .rot{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.valor .num{font-size:1.6rem;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.valor .num small{font-size:.9rem;font-weight:600;color:var(--muted)}
.valor .quem{font-size:.85rem;font-weight:600;padding:3px 10px;border-radius:999px;align-self:flex-start}
.valor .desc{font-size:.9rem;color:var(--muted)}
.valor.nosso{border-color:var(--primary);background:var(--soft)}
.quem.off{background:var(--soft2);color:var(--primary-strong)}
.quem.ferr{background:var(--warn-soft);color:var(--warn)}
.quem.venda{background:var(--ok-soft);color:var(--ok)}

.destaque{margin-top:18px;border-left:4px solid var(--primary);background:var(--soft);padding:14px 16px;border-radius:0 12px 12px 0}
.destaque strong{display:block;margin-bottom:2px}
.comparativo{margin-top:16px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center}
.comparativo div{border:1px solid var(--line);border-radius:14px;padding:14px 8px;background:var(--bg)}
.comparativo b{display:block;font-size:1.5rem;letter-spacing:-.02em}
.comparativo .x{font-weight:800;color:var(--muted);border:0;background:none;padding:0}
.comparativo .ganha{border-color:var(--primary);background:var(--soft)}
.comparativo .ganha b{color:var(--primary-strong)}
.comparativo small{color:var(--muted);font-size:.82rem}

/* Tabelas */
.tabela{margin-top:16px;overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;font-size:.95rem;min-width:460px}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--bg);font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
tr:last-child td{border-bottom:0}
td.def{color:var(--muted);font-style:italic}

/* Escada de comissão */
.escada{display:grid;gap:10px;margin-top:18px}
@media (min-width:640px){.escada{grid-template-columns:repeat(3,1fr);align-items:end}}
.degrau{border-radius:14px;padding:16px;color:#fff}
.degrau .n{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;opacity:.85;font-weight:700}
.degrau b{display:block;font-size:1.1rem;margin:4px 0 2px}
.degrau span{font-size:.88rem;opacity:.92}
.d1{background:hsl(217,70%,58%)}
.d2{background:hsl(221,76%,48%)}
.d3{background:hsl(226,71%,36%)}
@media (min-width:640px){.d1{min-height:110px}.d2{min-height:140px}.d3{min-height:170px}}

/* CTA */
.cta{background:linear-gradient(145deg,hsl(224,76%,44%) 0%,hsl(217,91%,55%) 100%);color:#fff;border:0}
.cta h2{color:#fff}
.cta p{opacity:.92}
.btn-wa{display:inline-flex;align-items:center;justify-content:center;gap:10px;margin-top:18px;background:#fff;color:hsl(224,76%,40%);font-weight:800;text-decoration:none;padding:14px 22px;border-radius:999px;font-size:1rem;max-width:100%;text-align:center}
.btn-wa svg{width:20px;height:20px;flex:none}
.cta .assin{margin-top:22px;font-size:.92rem;opacity:.9}
footer{text-align:center;color:var(--muted);font-size:.82rem;padding:8px 16px 40px}
@media print{#gate{display:none!important}.topo{-webkit-print-color-adjust:exact;print-color-adjust:exact}section{box-shadow:none;break-inside:avoid}.btn-wa{display:none}}
</style>
</head>
<body>

<div id="gate">
  <form id="form-senha" autocomplete="off">
    <span class="marca">Inova<span>SEO</span> · Off Digital</span>
    <h1>Proposta comercial para {{CLIENTE}}</h1>
    <p>Esta proposta é confidencial. Para abrir, digite a senha que você recebeu.</p>
    <label for="senha">Senha</label>
    <input id="senha" name="senha" type="password" inputmode="{{INPUTMODE}}" autocomplete="off" required>
    <button type="submit" id="entrar">Abrir proposta</button>
    <p id="erro" role="alert" hidden>Senha incorreta. Confira a senha enviada junto com o link.</p>
  </form>
</div>

<div id="proposta"></div>

<script>
(function(){
  var CFG={slug:"{{SLUG}}",cliente:"{{CLIENTE}}",aviso:"{{AVISO_URL}}",iter:{{ITERACOES}},sal:"{{SAL}}",iv:"{{IV}}",dados:"{{DADOS}}"};
  var form=document.getElementById("form-senha"),campo=document.getElementById("senha"),
      erro=document.getElementById("erro"),botao=document.getElementById("entrar");

  function ev(nome,params){try{gtag("event",nome,Object.assign({proposta:CFG.slug},params||{}));}catch(e){}}
  function px(tipo,nome,params){try{fbq(tipo,nome,Object.assign({proposta:CFG.slug},params||{}));}catch(e){}}
  function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
  var LIVRE={{SENHA_LIVRE}};function normalizar(t){t=String(t).trim();if(LIVRE)return t;if(t.indexOf("@")>-1)return t.toLowerCase();var d=t.replace(/\D/g,"");if((d.length===12||d.length===13)&&d.indexOf("55")===0)d=d.slice(2);return d;}


  // --- Modo dono: abra a proposta com ?dono=1 uma vez neste navegador e suas visitas deixam de contar/avisar.
  var DONO=false;
  try{if(/[?&]dono=1\b/.test(location.search))localStorage.setItem("prop_dono","1");
      if(/[?&]dono=0\b/.test(location.search))localStorage.removeItem("prop_dono");
      DONO=localStorage.getItem("prop_dono")==="1";}catch(e){}
  if(DONO){window["ga-disable-{{GA4_ID}}"]=true;}

  function once(chave){try{var k="av_"+CFG.slug+"_"+chave;if(sessionStorage.getItem(k))return false;sessionStorage.setItem(k,"1");return true;}catch(e){return true;}}
  var ROTULO={aberta:"proposta VISUALIZADA",rolou50:"proposta: lendo (50%)",rolou100:"proposta: leu at\u00e9 o fim",cta:"proposta: clicou no WhatsApp"};
  function dispositivo(){var u=navigator.userAgent;if(/iPad|Tablet/i.test(u)||(/Android/i.test(u)&&!/Mobile/i.test(u)))return "tablet";return /Mobi|iPhone|Android/i.test(u)?"mobile":"desktop";}
  // Mesmo Apps Script das auditorias (POST text/plain, sem CORS). O texto vai no campo "cliente".
  function avisar(evento){
    if(DONO||!CFG.aviso||!once("tg_"+evento))return;
    try{fetch(CFG.aviso,{method:"POST",mode:"no-cors",keepalive:true,headers:{"Content-Type":"text/plain"},
      body:JSON.stringify({cliente:(CFG.cliente+" \u00b7 "+ROTULO[evento]).slice(0,60),perfil_acesso:"prospecto",proposta:CFG.slug,evento:evento,empresa:CFG.cliente,dispositivo:dispositivo(),
        data_hora:new Date().toLocaleString("pt-BR",{timeZone:"America/Sao_Paulo"})})});}catch(e){}
  }

  // Rolagem (25/50/75/100%), tempo de leitura com a aba visível e seções vistas.
  function monitorar(){
    var marcos=[25,50,75,100],feitos={};
    function pct(){var d=document.documentElement,h=d.scrollHeight-window.innerHeight;return h<=0?100:Math.min(100,Math.round((window.pageYOffset/h)*100));}
    function checar(){
      var p=pct();
      marcos.forEach(function(m){
        if(p>=m&&!feitos[m]){feitos[m]=1;
          if(once("scroll_"+m)){ev("proposta_rolagem",{percent:m,percent_scrolled:m});}
          if(m===50)avisar("rolou50");
          if(m===100)avisar("rolou100");
        }
      });
    }
    var tick=false;
    window.addEventListener("scroll",function(){if(tick)return;tick=true;requestAnimationFrame(function(){tick=false;checar();});},{passive:true});
    checar();

    var seg=0,alvos=[30,60,120,300],vistos=0;
    setInterval(function(){
      if(document.visibilityState!=="visible")return;
      seg++;
      if(alvos.indexOf(seg)>-1)ev("proposta_tempo",{segundos:seg});
    },1000);

    if("IntersectionObserver" in window){
      var io=new IntersectionObserver(function(es){es.forEach(function(x){
        if(x.isIntersecting){var t=x.target.getAttribute("data-sec");io.unobserve(x.target);
          if(once("sec_"+t))ev("proposta_secao",{secao:t});}
      });},{threshold:0.5});
      document.querySelectorAll("#proposta section").forEach(function(el,i){
        var h=el.querySelector("h2");el.setAttribute("data-sec",(i+1)+" "+(h?h.textContent.trim().slice(0,40):"secao"));io.observe(el);
      });
    }
  }

  async function abrir(senha){
    var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(senha),"PBKDF2",false,["deriveKey"]);
    var chave=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(CFG.sal),iterations:CFG.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
    var claro=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(CFG.iv)},chave,b64(CFG.dados));
    return new TextDecoder().decode(claro);
  }

  function mostrar(html){
    var alvo=document.getElementById("proposta");
    alvo.innerHTML=html;
    document.getElementById("gate").remove();
    alvo.style.display="block";
    window.scrollTo(0,0);
    alvo.addEventListener("click",function(e){
      var a=e.target.closest("[data-cta]");
      if(a){ev("proposta_cta_whatsapp");px("track","Contact");avisar("cta");}
    });
  }

  async function tentar(senha,automatico){
    botao.disabled=true;botao.textContent="Abrindo…";erro.hidden=true;
    try{
      var html=await abrir(senha);
      try{sessionStorage.setItem("prop_"+CFG.slug,senha);}catch(e){}
      mostrar(html);
      ev("proposta_aberta");px("trackCustom","PropostaAberta");avisar("aberta");monitorar();
    }catch(e){
      try{sessionStorage.removeItem("prop_"+CFG.slug);}catch(_){}
      if(!automatico){erro.hidden=false;ev("proposta_senha_incorreta");}
      botao.disabled=false;botao.textContent="Abrir proposta";campo.select();
    }
  }

  form.addEventListener("submit",function(e){e.preventDefault();tentar(normalizar(campo.value),false);});
  try{var salvo=sessionStorage.getItem("prop_"+CFG.slug);if(salvo)tentar(salvo,true);}catch(e){}
})();
</script>
</body>
</html>
